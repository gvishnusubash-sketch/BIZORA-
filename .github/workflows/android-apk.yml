name: Build BIZORA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bizora (2).zip"
      - "google-services.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract latest BIZORA project
        run: |
          mkdir -p app-source
          unzip -q "bizora (2).zip" -d app-source
          test -f app-source/package.json
          test -d app-source/src

      - name: Inspect actual authentication implementation
        working-directory: app-source
        run: |
          {
            echo "=== SOURCE FILES ==="
            find src -type f | sort
            echo
            echo "=== AUTHENTICATION REFERENCES ==="
            grep -RniE "signInWithRedirect|signInWithPopup|signInWithGoogle|GoogleAuthProvider|FirebaseAuthentication|Capacitor.isNativePlatform|onAuthStateChanged|handleGoogle" src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' || true
            echo
            echo "=== CAPACITOR AUTH DEPENDENCIES ==="
            node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:Object.fromEntries(Object.entries({...p.dependencies,...p.devDependencies}).filter(([k])=>/capacitor.*auth|firebase.*auth|@capacitor\\//i.test(k))),capacitorConfig:p.capacitor},null,2))"
            for file in src/lib/firebase.ts src/contexts/AuthContext.tsx src/components/auth/SignInScreen.tsx src/components/auth/OnboardingScreen.tsx capacitor.config.ts; do
              if [ -f "$file" ]; then
                echo
                echo "=== FILE: $file ==="
                sed -n '1,420p' "$file"
              fi
            done
            echo
            echo "=== ANDROID CONFIG REFERENCES ==="
            grep -RniE "FirebaseAuthentication|google-services|com.google.gms.google-services|default_web_client_id|serverClientId|webClientId" android --include='*.gradle' --include='*.xml' --include='*.json' --include='*.kt' --include='*.java' || true
          } > ../auth-diagnostic.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install dependencies and build web app
        working-directory: app-source
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev esbuild@^0.28.2 typescript@6.0.3 --legacy-peer-deps
          npm run build

      - name: Generate Android project and sync
        working-directory: app-source
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          test -f ../google-services.json
          mkdir -p android/app
          cp ../google-services.json android/app/google-services.json
          # Capawesome Firebase Authentication requires the Google provider
          # and Android Credential Manager dependencies to be enabled.
          if ! grep -q "rgcfaIncludeGoogle" android/variables.gradle; then
            python3 -c "from pathlib import Path; p=Path('android/variables.gradle'); s=p.read_text(); p.write_text(s.replace('ext {', \"ext {\\n    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'\", 1))"
          fi
          grep -nE "rgcfaIncludeGoogle|androidxCredentialsVersion" android/variables.gradle

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: bizora-android-debug-keystore-v2

      - name: Build debug APK and report signing fingerprints
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew signingReport > ../signing-report.txt
          {
            echo
            echo "=== ANDROID DEBUG SIGNING FINGERPRINTS ==="
            cat ../signing-report.txt
            echo
            echo "=== ANDROID VARIABLES ==="
            cat variables.gradle
            echo
            echo "=== GENERATED GOOGLE SERVICES RESOURCES ==="
            grep -RniE "default_web_client_id|google_app_id" app/build/generated/res/google-services/debug/values || true
          } >> ../../auth-diagnostic.txt

      - name: Upload authentication diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: BIZORA-auth-diagnostic
          path: auth-diagnostic.txt
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIZORA-Android-debug-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
